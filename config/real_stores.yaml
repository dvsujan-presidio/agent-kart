#     (big-retailer UCP checkout runs privately through Google / Microsoft, not a public manifest)
#   BLOCKED (HTTP 403, bot protection): sugarfina.com. A manifest may exist but automated GETs are refused.
#   VERIFIED: gymshark.com (score 94/A). Earlier "404" was because www.gymshark.com was checked;
