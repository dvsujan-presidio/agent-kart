# config/real_stores.yaml
# Real Store Mode: US stores with LIVE UCP manifests, grouped by scenario (24 entries, 23 unique stores, 5 scenarios; family-friendly only).
# Schema: scenarios.<id>.{pitch, showcases, stores[]}. Each store: id, name, domain, manifest,
# ucp_mcp_endpoint, permalink_endpoint, covers, price_level?, notes?, enabled, mcp_verified.
# Endpoints here are a snapshot for humans; code must re-read them from each manifest at runtime.
#
# Verified 2026-10-14 by fetching each store's /.well-known/ucp (GET).
# Every store below publishes:
#   ucp.version: 2026-08-25 (also supports 2026-04-08, 2026-01-23)
#   service dev.ucp.shopping over MCP at https://{myshopify_domain}/api/ucp/mcp
#   capabilities: catalog.search, catalog.lookup, cart, checkout, discount (ext),
#                 fulfillment (ext, shipping), order, permalink, identity_linking (Shop accounts OAuth)
#   payment handlers: Google Pay, Shopify card, Shop Pay
#
# IMPORTANT
# - The MCP endpoint is on the *.myshopify.com domain, not the public domain. Always read it
#   from the manifest at runtime instead of hardcoding (it can change).
# - "Declares checkout" != "anonymous agents may complete checkout". Expect agent profile /
#   auth requirements on cart and checkout calls. AgentKart never completes payment on real stores.
# - Handoff: use the UCP permalink capability (endpoint below) to send the shopper to the
#   store's real checkout with the cart pre-filled. This keeps the whole flow UCP-native.
# - NOT yet verified: actual MCP tool calls (POST). Workstream F runs one catalog search
#   per store with the AgentKart agent profile and sets mcp_verified: true.

currency: USD
verified_on: 2026-10-14
ucp_version: "2026-08-25"

scenarios:

  birthday_party:
