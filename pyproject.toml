[project]
name = "agentkart"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.60",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "pydantic-to-typescript>=2.0"]
voice = ["livekit-agents>=1.0", "livekit-plugins-azure", "livekit-plugins-silero", "livekit-plugins-turn-detector", "livekit-api"]

[tool.pytest.ini_options]
pythonpath = [".", "agent"]
testpaths = ["contracts", "domain", "agent", "voice", "stores"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
